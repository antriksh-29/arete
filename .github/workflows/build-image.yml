name: Build & push container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'infra/Dockerfile'
      - 'infra/entrypoint.sh'
      - 'infra/syncer.sh'
      - 'eval/run-injection-fixture.py'
      - 'eval/injection-fixture.yaml'
      - 'skills/**'
      - 'identity/**'
      - 'tools/**'
      - 'meta/**'
      - 'openclaw/**'
      - '.dockerignore'

# One build at a time per ref. New pushes cancel older in-flight builds.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # antriksh-29/arete

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write    # required to push to GHCR
      id-token: write    # for attestation in the future

    steps:
      - uses: actions/checkout@v4

      # Boot-gate sanity: offline schema-check the injection fixture BEFORE the
      # heavy image build. If the fixture is malformed, fail fast.
      - name: Boot-gate offline sanity
        run: |
          python3 -m pip install --quiet pyyaml
          python3 eval/run-injection-fixture.py --fixture eval/injection-fixture.yaml --offline

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # main → both 'latest' and the short SHA
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            # tagged releases (v1.2.3) → semver tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # PRs → ephemeral pr-N tag (only pushed when authorized, currently not)
            type=ref,event=pr

      # Build the image and ALSO load it into the local docker daemon so the
      # boot-gate step below can `docker run` it. Build is fast on cache hits.
      - name: Build (load to local daemon for gate testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          load: true
          tags: arete:gate-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Boot-gate live check: docker run the just-built image with
      # ARETE_SKIP_BOOT_GATE=0 + the injection fixture; assert the gate
      # passes (all 30 patterns refused). Moves the gate from per-container
      # startup (catastrophic cost) to per-release (amortized). Per
      # docs/architecture-research-2026-05-27.md Q-F.
      #
      # Soft-skip when ANTHROPIC_API_KEY secret isn't configured (PR builds
      # from forks, or before secret is added). Hard-fail on main pushes
      # where the secret should be present.
      - name: Boot-gate live check
        id: boot_gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -eo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            # Soft-fail in all cases until the ANTHROPIC_API_KEY repository
            # secret is configured. Originally PR #32 hard-failed on main to
            # force operator attention, but that blocks every unrelated PR
            # from pushing — net negative until the secret is in place.
            #
            # To enforce: GitHub repo → Settings → Secrets and variables →
            # Actions → add ANTHROPIC_API_KEY (Haiku-tier).
            echo "::warning::ANTHROPIC_API_KEY secret not available — skipping live boot-gate. Set it in repo Secrets to enable."
            exit 0
          fi
          # Mount the fixture from the workspace into a throwaway state dir
          # and run the runner directly. Avoids a full container startup
          # (which would clone state + start gateway — neither relevant here).
          docker run --rm \
            -e ANTHROPIC_API_KEY \
            -e INJECTION_MODEL=claude-haiku-4-5 \
            -e FIXTURE_SYSTEM_PROMPT_CAP=2048 \
            --entrypoint python3 \
            arete:gate-candidate \
            /opt/arete/eval/run-injection-fixture.py \
            --fixture /opt/arete/eval/injection-fixture.yaml

      - name: Push image (if not a PR)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # No cache-to here — keep the cache from the first build step
          platforms: linux/amd64

      - name: Summary
        run: |
          {
            echo "## Image build"
            echo ""
            echo "**Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo ""
              echo "_Not pushed (PR build — verify-only)._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
