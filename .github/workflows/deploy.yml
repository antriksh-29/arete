name: Deploy to VPS
on:
  push:
    branches: [main]

# Single-flight: a new push to main cancels any older deploy still
# running for the same branch. Avoids two concurrent deploys racing
# on the box.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo (for the SSH config / sanity)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need history for the diff in the gate step below

      # ── Server-side skill-author gate re-run (T8) ─────────────
      # Defense in depth: any user-skills/<slug>/ that landed on this
      # commit must pass the same safety + file-allowlist checks that
      # ran locally before the commit was pushed. Catches a compromised
      # local machine that pushed a malicious user-skill.
      #
      # The LLM-backed reviewer is skipped server-side (it would need
      # the Anthropic key in CI secrets — security tradeoff we don't
      # need; local gate already covers it). The regex IOC pass + file
      # allowlist runs here and is enough to block the obvious
      # SkillJect / curl-pipe-sh / hardcoded-credential attacks.
      - name: Skill-author server-side gate
        run: |
          set -eo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_SLUGS=$(ls user-skills 2>/dev/null | grep -v '^\.' || true)
          else
            CHANGED_SLUGS=$(git diff --name-only "$BEFORE" "$AFTER" -- user-skills/ \
              | awk -F/ 'NF>=2 {print $2}' | sort -u || true)
          fi
          if [ -z "$CHANGED_SLUGS" ]; then
            echo "no user-skills/ changes — skipping skill-author gate"
            exit 0
          fi
          echo "changed user-skills slugs: $CHANGED_SLUGS"

          ALLOWED='SKILL\.md|eval\.yaml|\.usage\.json'
          for slug in $CHANGED_SLUGS; do
            d="user-skills/$slug"
            [ -d "$d" ] || continue
            STRAY=$(find "$d" -mindepth 1 -maxdepth 1 -type f \
              | grep -vE "/($ALLOWED)\$" || true)
            if [ -n "$STRAY" ]; then
              echo "::error::user-skills/$slug/ has disallowed files:"
              echo "$STRAY"
              exit 1
            fi
            NESTED=$(find "$d" -mindepth 1 -maxdepth 1 -type d || true)
            if [ -n "$NESTED" ]; then
              echo "::error::user-skills/$slug/ has disallowed subdirectories:"
              echo "$NESTED"
              exit 1
            fi
          done
          echo "file allowlist: OK"

          # Install bun (cached on subsequent runs by GH Actions cache layer).
          if ! command -v bun >/dev/null 2>&1; then
            curl -fsSL https://bun.sh/install | bash
            export PATH="$HOME/.bun/bin:$PATH"
          fi

          for slug in $CHANGED_SLUGS; do
            d="user-skills/$slug"
            [ -d "$d" ] || continue
            SKILL_MD=$(cat "$d/SKILL.md" 2>/dev/null || echo "")
            EVAL_YAML=$(cat "$d/eval.yaml" 2>/dev/null || echo "")
            if [ -z "$SKILL_MD" ]; then
              echo "::warning::user-skills/$slug/ has no SKILL.md after diff — likely deleted, skipping"
              continue
            fi
            BUNDLE=$(jq -n \
              --arg slug "$slug" \
              --arg skill "$SKILL_MD" \
              --arg eval "$EVAL_YAML" \
              '{slug:$slug, mode:"create", forked_from:null,
                frontmatter:{}, skill_md_body:$skill,
                eval_yaml_text:$eval, elicit_qa:[]}')
            echo "$BUNDLE" | bun run meta/skill-author/scripts/safety-scan.ts --regex-only > /tmp/scan-$slug.json
            VERDICT=$(jq -r '.verdict' /tmp/scan-$slug.json)
            if [ "$VERDICT" != "pass" ]; then
              echo "::error::user-skills/$slug/ failed server-side safety scan: $VERDICT"
              jq '.' /tmp/scan-$slug.json
              exit 1
            fi
            echo "user-skills/$slug/: server-side safety OK"
          done

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host bot
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy on VPS (git pull + deploy-vps.sh)
        run: |
          ssh bot 'set -euo pipefail
            cd ~/personal-assistant
            git fetch --quiet origin main
            git reset --hard origin/main
            bash infra/deploy-vps.sh
          '

      - name: Post-deploy smoke probe
        run: |
          ssh bot 'set -uo pipefail
            # Cheap signal: openclaw-gateway should be active right after deploy.
            systemctl --user is-active openclaw-gateway.service || {
              echo "::error::openclaw-gateway not active after deploy"
              systemctl --user status openclaw-gateway.service --no-pager | head -20
              exit 1
            }
            echo "openclaw-gateway: active"
          '

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Deploy failed. Inspect the SSH steps above and check the VPS via 'ssh bot' + 'journalctl --user -u openclaw-gateway -n 100'."
