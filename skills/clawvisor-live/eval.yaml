# Eval suite for clawvisor-live.
skill: clawvisor-live
script: null
version: 1

triggers:
  # ── calendar live ──
  - id: cv-001
    utterance: "what's on my calendar today"
    expect_skill: clawvisor-live
  - id: cv-002
    utterance: "what's on my calendar tomorrow"
    expect_skill: clawvisor-live
  - id: cv-003
    utterance: "am I free Friday afternoon"
    expect_skill: clawvisor-live
  - id: cv-004
    utterance: "any meetings this afternoon"
    expect_skill: clawvisor-live
  - id: cv-005
    utterance: "who's on the 3pm call"
    expect_skill: clawvisor-live

  # ── gmail live ──
  - id: cv-006
    utterance: "find the email from Kaushik last week"
    expect_skill: clawvisor-live
  - id: cv-007
    utterance: "did anyone reply to the budget thread"
    expect_skill: clawvisor-live
  - id: cv-008
    utterance: "pull the full body of the latest email from sequoia"
    expect_skill: clawvisor-live
  - id: cv-009
    utterance: "show me the thread with Anand"
    expect_skill: clawvisor-live

  # ── negative cases ──
  - id: cv-neg-001
    utterance: "what was my last meeting with Kaushik about"
    expect_skill: brain-search
    notes: "historical question — brain-first per rule 9"
  - id: cv-neg-002
    utterance: "send Kaushik an email"
    expect_skill: default
    notes: "gmail SEND, gated separately"
  - id: cv-neg-003
    utterance: "remind me about the 3pm call"
    expect_skill: reminders

smoke:
  cmd: "true"
  expect_exit: 0
