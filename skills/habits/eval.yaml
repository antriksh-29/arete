# Eval suite for habits dispatcher.
# This is a META-skill that documents how water-log + reading-checkin
# interoperate. The underlying skills own their own utterance triggers
# (see skills/water-log/eval.yaml and skills/reading-checkin/eval.yaml).
# Triggers here are intentionally narrow — only utterances that ask
# ABOUT the habit system as a whole, not specific log writes/reads.
skill: habits
script: null
version: 1

triggers:
  # ── meta / system-level questions ──
  - id: hb-001
    utterance: "what habits am I tracking"
    expect_skill: habits
  - id: hb-002
    utterance: "show me all my habits"
    expect_skill: habits
  - id: hb-003
    utterance: "habit overview"
    expect_skill: habits
  - id: hb-004
    utterance: "how am I doing on my habits"
    expect_skill: habits
  - id: hb-005
    utterance: "add a new habit to track"
    expect_skill: habits

  # ── negative cases — specific habits go to their own skills ──
  - id: hb-neg-001
    utterance: "drank 750ml"
    expect_skill: water-log
    notes: "specific water log → water-log skill, not dispatcher"
  - id: hb-neg-002
    utterance: "how much water today"
    expect_skill: water-log
  - id: hb-neg-003
    utterance: "reading streak"
    expect_skill: reading-checkin
  - id: hb-neg-004
    utterance: "yes"
    expect_skill: reading-checkin
    notes: "after a Reading check-in"

smoke:
  cmd: "true"
  expect_exit: 0
