# Eval suite for reading-list.
skill: reading-list
script: infra/reading-list.py
version: 1

triggers:
  # ── shallow add (default) ──
  - id: rl-001
    utterance: "save this for later"
    has_url: true
    expect_skill: reading-list
  - id: rl-002
    utterance: "save this"
    has_url: true
    expect_skill: reading-list
  - id: rl-003
    utterance: "read later"
    has_url: true
    expect_skill: reading-list
  - id: rl-004
    utterance: "add to reading list"
    has_url: true
    expect_skill: reading-list
  - id: rl-005
    utterance: "queue this"
    has_url: true
    expect_skill: reading-list
  - id: rl-006
    utterance: "queue this for reading"
    has_url: true
    expect_skill: reading-list

  # ── deep add (explicit absorb) ──
  - id: rl-007
    utterance: "save this and absorb it"
    has_url: true
    expect_skill: reading-list
    notes: "longer phrase wins over 'absorb' alone (which would route to ingest-* with right URL)"
  - id: rl-008
    utterance: "save this deep"
    has_url: true
    expect_skill: reading-list
  - id: rl-009
    utterance: "save and ingest this"
    has_url: true
    expect_skill: reading-list

  # ── show / list ──
  - id: rl-010
    utterance: "show reading list"
    expect_skill: reading-list
  - id: rl-011
    utterance: "what's on my reading list"
    expect_skill: reading-list
  - id: rl-012
    utterance: "reading queue"
    expect_skill: reading-list
  - id: rl-013
    utterance: "what should I read"
    expect_skill: reading-list

  # ── mark as read ──
  - id: rl-014
    utterance: "I read #2"
    expect_skill: reading-list
  - id: rl-015
    utterance: "mark #2 as read"
    expect_skill: reading-list
  - id: rl-016
    utterance: "I finished Sapiens"
    expect_skill: reading-list

  # ── remove ──
  - id: rl-017
    utterance: "remove #2 from reading list"
    expect_skill: reading-list
  - id: rl-018
    utterance: "drop #2"
    expect_skill: reading-list

  # ── negative cases ──
  - id: rl-neg-001
    utterance: "ingest this"
    has_url: true
    expect_skill: ingest-pdf
    notes: "explicit ingest with PDF URL → ingest-pdf, not reading-list"
  - id: rl-neg-002
    utterance: "what does this say"
    has_image: true
    expect_skill: image-ocr
  - id: rl-neg-003
    utterance: "yes"
    expect_skill: reading-checkin
    notes: "after 10am check-in → reading-checkin (different skill!)"
  - id: rl-neg-004
    utterance: "drank 750ml"
    expect_skill: water-log

outputs:
  - id: rl-out-smoke
    cmd: "python3 infra/reading-list.py --smoke"
    expect_json_keys: [ok, user_message]
    expect_ok: true

smoke:
  cmd: "python3 infra/reading-list.py --smoke"
  expect_exit: 0
