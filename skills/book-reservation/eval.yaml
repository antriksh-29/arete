# Eval suite for book-reservation.
skill: book-reservation
script: infra/book-reservation.py
version: 1

triggers:
  - id: br-001
    utterance: "book a table at Uru Brewpark for 2 tonight at 8 PM"
    has_url: false
    expect_skill: book-reservation
  - id: br-002
    utterance: "reserve a table for 4 tomorrow at 7 PM at District"
    has_url: false
    expect_skill: book-reservation
  - id: br-003
    utterance: "make a reservation at Soka for tonight"
    has_url: false
    expect_skill: book-reservation
  - id: br-004
    utterance: "i want to book Pi at 9 PM for 2"
    has_url: false
    expect_skill: book-reservation
  - id: br-005
    utterance: "can you book Uru for me tonight at 8"
    has_url: false
    expect_skill: book-reservation
  - id: br-006
    utterance: "book a table for 6"
    has_url: false
    expect_skill: book-reservation
  - id: br-not-001
    utterance: "what's Uru's menu"
    has_url: false
    expect_skill: chat
  - id: br-not-002
    utterance: "save https://example.com for later"
    has_url: true
    expect_skill: reading-list

smoke:
  cmd: python3 infra/book-reservation.py --smoke
  expect_exit: 0
  expect_stdout_contains: '"ok": true'

outputs:
  - id: br-out-smoke
    cmd: python3 infra/book-reservation.py --smoke
    expect_keys: ["ok", "skill", "user_message"]
