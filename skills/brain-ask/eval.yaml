skill: brain-ask
script: infra/brain-ask.py
version: 2

triggers:
  - id: ba-001
    utterance: "what does Nishank say about ambition?"
    expect_skill: brain-ask
  - id: ba-002
    utterance: "quote the top 3 takeaways from Tobi's tweet"
    expect_skill: brain-ask
  - id: ba-003
    utterance: "summarize the QOVES article"
    expect_skill: brain-ask
  - id: ba-004
    utterance: "what's the core argument of Paul Graham's founder mode essay"
    expect_skill: brain-ask
