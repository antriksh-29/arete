#cloud-config
# Arete Docker-host cloud-init (Hetzner first-boot).
#
# Tested on CPX32 (4 vCPU / 8 GB / 160 GB, Falkenstein). Smaller boxes work
# but headroom is the bottleneck once you cross ~5 active tenants.
#
# Paste into Hetzner's "Cloud config" field on server creation OR run
# infra/bootstrap-host.sh on an existing box (idempotent).
#
# Sets up:
#   - timezone UTC (per-tenant timezone is applied inside each container)
#   - Docker Engine + compose plugin
#   - non-root user `arete` (sudo + docker group)
#   - UFW: 22, 80, 443 open from anywhere; everything else denied
#   - fail2ban (default ssh jail)
#   - 4 GB swap (CPX32 has 8 GB RAM; swap protects against tenant container OOM spikes)
#   - skeleton dirs: /var/tenants, /var/lib/arete-creds, /etc/arete-secrets, /var/log/arete
#
# Does NOT (those happen in infra/bootstrap-host.sh, run after cloud-init):
#   - install Caddy + provision TLS cert (needs domain DNS pointed at this box first)
#   - pull the Arete container image
#   - install the router/provisioner systemd units
#   - clone the platform repo

timezone: Etc/UTC

package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - ca-certificates
  - curl
  - gnupg
  - git
  - jq
  - htop
  - rsync
  - unattended-upgrades

users:
  - name: arete
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo, docker]
    ssh_authorized_keys:
      # Hetzner injects the SSH keys you selected at server-create time into
      # both /root/.ssh/authorized_keys AND /home/arete/.ssh/authorized_keys,
      # so you can leave this empty as long as you picked a key in the
      # Hetzner Cloud Console.
      #
      # If you want to harden later, replace with explicit pubkeys here and
      # disable root login via SSH (PermitRootLogin no).

write_files:
  - path: /etc/sysctl.d/99-arete.conf
    content: |
      # Lower swappiness so we use swap only under real memory pressure.
      vm.swappiness=10
      # Improve TCP perf for many small concurrent connections (Telegram webhooks).
      net.core.somaxconn=4096
      net.ipv4.tcp_fin_timeout=15

  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        },
        "live-restore": true
      }

runcmd:
  # ── Install Docker (official repo, supports compose plugin) ────────────────
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - bash -c 'echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker

  # ── Swap (4 GB) — guard against tenant container OOM spikes ────────────────
  - bash -c 'test -f /swapfile || (fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo "/swapfile none swap sw 0 0" >> /etc/fstab)'
  - sysctl --system

  # ── UFW: deny everything in by default, allow SSH + HTTP(S) ───────────────
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable

  # ── fail2ban ───────────────────────────────────────────────────────────────
  - systemctl enable --now fail2ban

  # ── Skeleton dirs ──────────────────────────────────────────────────────────
  - install -d -m 0755 -o arete -g arete /var/tenants
  - install -d -m 0700 -o arete -g arete /var/lib/arete-creds
  - install -d -m 0700 -o root  -g root  /etc/arete-secrets
  - install -d -m 0755 -o arete -g arete /var/log/arete

  # ── Unattended security upgrades ───────────────────────────────────────────
  - dpkg-reconfigure -plow unattended-upgrades

  # ── Sanity ─────────────────────────────────────────────────────────────────
  - docker --version
  - docker compose version
  - id arete
  - ufw status verbose

final_message: |
  Arete host cloud-init complete. Next:
    1. SSH in as `arete@<ip>` (key-based — root login still works too).
    2. Run `sudo bash infra/bootstrap-host.sh` (clones repo + runs script).
    3. Point your domain's A record at this box, then re-run bootstrap-host.sh
       with PLATFORM_DOMAIN set to provision Caddy + Let's Encrypt cert.
