#cloud-config
# Hetzner first-boot config for personal AI assistant VPS.
# Tested on CX23 (x86, eu-central / Falkenstein). CX22 also fine.
# Sets timezone, hardens SSH/UFW/fail2ban, creates botuser, installs core packages,
# pre-creates dirs for vault + logs.
# See docs/HETZNER-SETUP.md for the full provisioning walkthrough.
#
# Pasted into Hetzner "Cloud config" field on server creation.
# After provisioning: ssh botuser@<vps-ip> should succeed (key-based, no password).
#
# What it does NOT do:
# - Install Bun (done in Phase 1 — depends on user verifying SSH first)
# - Install OpenClaw / GBrain (done in Phases 3 + 4)
# - Set up Caddy reverse proxy (done in Phase 1)
# - Provision the credential vault (done in Phase 2)
#
# Idempotent: re-running cloud-init won't break anything, but Hetzner only runs it on first boot anyway.

timezone: Asia/Kolkata

package_update: true
package_upgrade: true

packages:
  - ufw
  - fail2ban
  - tmux
  - ripgrep
  - htop
  - jq
  - rclone
  - curl
  - git
  - python3.11
  - python3.11-venv
  - python3-pip
  - sqlite3
  - unzip
  - ca-certificates
  - gnupg

users:
  - name: botuser
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo]
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFUVpoJ2io/NqpketRS2QKw7igmU4pw/mE6lWaoLIyQQ antriksh1980@gmail.com

write_files:
  # SSH hardening — disable password auth, root login, restrict to ed25519/rsa
  - path: /etc/ssh/sshd_config.d/99-bot-hardening.conf
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      ChallengeResponseAuthentication no
      KbdInteractiveAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowUsers botuser
      MaxAuthTries 3
      LoginGraceTime 30

  # fail2ban — basic SSH protection
  - path: /etc/fail2ban/jail.d/sshd.local
    permissions: '0644'
    content: |
      [sshd]
      enabled = true
      port = 22
      maxretry = 5
      findtime = 600
      bantime = 3600

runcmd:
  # UFW firewall — deny all incoming except SSH/HTTP/HTTPS
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'ssh'
  - ufw allow 80/tcp comment 'http (caddy autocert challenge)'
  - ufw allow 443/tcp comment 'https'
  - ufw --force enable

  # Restart SSH with new hardening
  - systemctl restart ssh

  # Enable fail2ban
  - systemctl enable --now fail2ban

  # Pre-create directories per PRD §A.1
  - mkdir -p /etc/bot-secrets && chmod 700 /etc/bot-secrets && chown botuser:botuser /etc/bot-secrets
  - mkdir -p /var/lib/bot-creds && chmod 700 /var/lib/bot-creds && chown botuser:botuser /var/lib/bot-creds
  - mkdir -p /var/log/bot-creds && chmod 750 /var/log/bot-creds && chown botuser:botuser /var/log/bot-creds
  - touch /var/log/bot-creds/access.log && chmod 640 /var/log/bot-creds/access.log && chown botuser:botuser /var/log/bot-creds/access.log
  - mkdir -p /var/log/openclaw && chmod 750 /var/log/openclaw && chown botuser:botuser /var/log/openclaw
  # NOTE: /var/log/caddy is intentionally NOT pre-created here. The caddy user does
  # not exist until `apt install caddy` runs (Phase 1), and pre-creating the dir as
  # root causes permission-denied when caddy reloads with a config that writes logs.
  # The caddy postinst creates the dir with correct ownership.

  # Disable unattended-upgrades automatic restart at random times (we want predictable uptime)
  # but keep security updates. systemd unit will be tuned in Phase 1.
  - sed -i 's|//Unattended-Upgrade::Automatic-Reboot "true";|Unattended-Upgrade::Automatic-Reboot "false";|' /etc/apt/apt.conf.d/50unattended-upgrades || true

  # Marker file so Phase 1 setup script can detect cloud-init completed
  - echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) cloud-init complete" > /var/log/cloud-init-bot-marker.log

# After this completes, expect:
#   ssh botuser@<vps-ip>  → shell prompt
#   sudo -n true           → no password prompt
#   ls /var/lib/bot-creds  → empty dir owned by botuser
#   ufw status             → 22/80/443 allowed, all else denied
