# Retrieval eval set
#
# Tests whether the brain returns the RIGHT pages for a given query. Distinct
# from injection-fixture (refusal of malicious input) and behavioral-eval
# (overall response quality). This one is narrowly about retrieval ranking.
#
# ─────────────────────────────────────────────────────────────────────────────
# Schema (per entry)
# ─────────────────────────────────────────────────────────────────────────────
#
#   id:                  unique, intent-prefixed (person-prep-001, recall-001, etc.)
#   query:               the literal text the user / agent submits
#   intent:              one of:
#                          person_prep    — "prep me for X"
#                          recall         — "what did I say about X"
#                          recent         — "what happened today / this week"
#                          conceptual     — "how do I think about X"
#                          temporal       — "what was on Tuesday"
#   expected_top3:       list of 3 page IDs that SHOULD appear in the top 3 results
#   acceptable_top10:    list of additional page IDs that are fine in the top 10
#   recency_decay:       expected setting for this query type (e.g. "30d half-life")
#   entity_boost_for:    list of entity names the KG-traversal should boost
#   notes:               operator context
#
# Pass thresholds (eng plan §A1): nDCG@3 ≥ 0.7, MRR ≥ 0.8 across the suite.
#
# ─────────────────────────────────────────────────────────────────────────────
# Day-1 entries (2026-04-30) — authored against real brain state from Phase 4.5
# bootstrap. Brain content: 9 people, 11 companies, 10 meetings, antriksh self-page,
# personal-ai-assistant project page.
# ─────────────────────────────────────────────────────────────────────────────

- id: person-prep-001
  query: "prep me for Kaushik"
  intent: person_prep
  expected_top3:
    - people/kaushik-immadisetty
    - companies/armoriq
    - meetings/2026-04-23-kaushik-antriksh-pilot-discussion-and-ne
  acceptable_top10: []
  recency_decay: "30d half-life"
  entity_boost_for: [Kaushik, ArmorIQ]
  notes: |
    Real upcoming-followup case. The meeting page + person + company should
    all surface so the agent can construct a full prep dossier.

